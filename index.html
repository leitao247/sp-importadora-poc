<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Prova de Conceito – Harmonização de Vinhos</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f4f4f4;
}

h1, h2 {
    margin-top: 30px;
}

section {
    background: #fff;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 6px;
}

select, button {
    padding: 6px;
    margin-top: 8px;
}

.resultado {
    margin-top: 10px;
    padding: 10px;
    background: #fafafa;
    border: 1px solid #ddd;
}
</style>
</head>

<body>

<h1>Harmonização de Vinhos – POC</h1>

<section>
<h2>1) Harmonização por Vinho</h2>
<select id="vinhoSelect"></select>
<button onclick="harmonizarPorVinho()">Harmonizar</button>
<div id="resultadoVinho" class="resultado"></div>
</section>

<section>
<h2>2) Menu Completo</h2>
<button onclick="menuCompleto()">Gerar Menu</button>
<div id="resultadoMenu" class="resultado"></div>
</section>

<section>
<h2>3) Simulação de Compra por Preço</h2>
<select id="faixaSelect">
<option value="100">Até R$100</option>
<option value="200">Até R$200</option>
<option value="300">Até R$300</option>
<option value="400">Até R$400</option>
<option value="500">Até R$500</option>
</select>
<button onclick="simularCompra()">Simular</button>
<div id="resultadoCompra" class="resultado"></div>
</section>

<script>
// ==========================
// TABELA DE VINHOS SIMULADA
// ==========================
const vinhos = [
    {
        nome: "Porta 6 Tinto",
        uvas: ["Aragonez", "Castelão", "Touriga Nacional"],
        estilo: "tinto medio",
        regiao: "Portugal",
        preco: 79
    },
    {
        nome: "Porta 6 Branco",
        uvas: ["Fernão Pires", "Arinto", "Sauvignon Blanc"],
        estilo: "branco leve",
        regiao: "Portugal",
        preco: 72
    },
    {
        nome: "Isla Negra Carmenere",
        uvas: ["Carmenere"],
        estilo: "tinto intenso",
        regiao: "Chile",
        preco: 89
    },
    {
        nome: "Viñas del Tango Malbec",
        uvas: ["Malbec"],
        estilo: "tinto intenso",
        regiao: "Argentina",
        preco: 95
    },
    {
        nome: "Martha’s Porto Tawny",
        uvas: ["Blend"],
        estilo: "doce",
        regiao: "Portugal",
        preco: 120
    }
];

// ==========================
// POPULA SELECT DE VINHOS
// ==========================
const select = document.getElementById("vinhoSelect");
vinhos.forEach((v, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = v.nome;
    select.appendChild(opt);
});

// ==========================
// HARMONIZAÇÃO POR VINHO
// ==========================
function harmonizarPorVinho() {
    const vinho = vinhos[select.value];
    let pratos = [];

    if (vinho.estilo.includes("branco")) {
        pratos = ["Peixe grelhado", "Salada com queijo", "Frutos do mar"];
    } else if (vinho.estilo.includes("tinto medio")) {
        pratos = ["Massas", "Carnes assadas", "Queijos semiduros"];
    } else if (vinho.estilo.includes("intenso")) {
        pratos = ["Carnes vermelhas", "Cordeiro", "Queijos curados"];
    } else if (vinho.estilo.includes("doce")) {
        pratos = ["Sobremesas com caramelo", "Chocolate amargo", "Queijos azuis"];
    }

    document.getElementById("resultadoVinho").innerHTML =
        "<strong>" + vinho.nome + "</strong><br>" +
        pratos.slice(0, 5).join("<br>");
}

// ==========================
// MENU COMPLETO
// ==========================
function menuCompleto() {
    const entrada = vinhos.find(v => v.estilo.includes("branco"));
    const principal = vinhos.find(v => v.estilo.includes("intenso"));
    const sobremesa = vinhos.find(v => v.estilo.includes("doce"));

    document.getElementById("resultadoMenu").innerHTML =
        "Entrada: " + entrada.nome + "<br>" +
        "Prato Principal: " + principal.nome + "<br>" +
        "Sobremesa: " + sobremesa.nome + "<br><br>" +
        "Progressão pensada para começar leve, evoluir em estrutura e finalizar doce.";
}

// ==========================
// SIMULAÇÃO DE COMPRA
// ==========================
function simularCompra() {
    const limite = Number(document.getElementById("faixaSelect").value);
    let total = 0;
    let escolhidos = [];
    let regioes = new Set();

    for (let v of vinhos) {
        if (total + v.preco <= limite && escolhidos.length < 5) {
            escolhidos.push(v);
            total += v.preco;
            regioes.add(v.regiao);
        }
    }

    document.getElementById("resultadoCompra").innerHTML =
        "Garrafas: " + escolhidos.length + "<br>" +
        "Vinhos:<br>" +
        escolhidos.map(v => v.nome).join("<br>") + "<br><br>" +
        "Regiões: " + Array.from(regioes).join(", ") + "<br>" +
        "Total aproximado: R$ " + total;
}
</script>

</body>
</html>
